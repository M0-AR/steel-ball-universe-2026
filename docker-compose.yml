services:
  lab:
    build: .
    container_name: steel-ball-lab
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - TZ=UTC
    command: python -m src.run_all_benchmarks --output /app/reports/benchmark.json --figures /app/reports
    networks:
      - physics-net

  test:
    build: .
    container_name: steel-ball-test
    volumes:
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app
    command: pytest tests/ -v
    depends_on:
      - lab
    networks:
      - physics-net

  jupyter:
    build: .
    container_name: steel-ball-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    profiles:
      - interactive
    networks:
      - physics-net

networks:
  physics-net:
    driver: bridge
